[project]
name = "enterprise-ai-chatbot"
version = "0.1.0"
description = "Production-grade multi-agent enterprise AI chatbot with RAG, SQL tooling, guardrails, observability, FastAPI, and Streamlit."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.37.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pyodbc>=5.1.0",
    "sqlparse>=0.5.1",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "prometheus-client>=0.20.0",
    "langfuse>=2.44.0",
    "cachetools>=5.4.0",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.7.0",
]
eval = [
    "ragas>=0.1.15",
    "deepeval>=0.21.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "app*",
    "agents*",
    "api*",
    "app_logging*",
    "config*",
    "evaluation*",
    "memory*",
    "models*",
    "monitoring*",
    "rag*",
    "services*",
    "tools*",
    "ui*",
]
exclude = [
    "docs*",
    "docker*",
    "deployment*",
    "notebooks*",
    "sample_data*",
    "tests*",
    "logging*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
